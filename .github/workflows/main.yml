name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: Test (Ruby ${{ matrix.ruby }} on ${{ matrix.os }})
    timeout-minutes: 5
    strategy:
      matrix:
        ruby:
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
        os:
          - ubuntu-latest
          - macos-latest
    env:
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
      BINDGEN_EXTRA_CLANG_ARGS: -DHAVE_STDBOOL_H=1

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Ruby & Rust
      uses: oxidize-rb/actions/setup-ruby-and-rust@v1.5.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        cargo-cache: true
        bundler: "latest"
        rubygems: "latest"

    - name: Run test
      run: bundle exec rake

  macos-kqueue:
    runs-on: macos-latest
    name: Test (kqueue backend)
    timeout-minutes: 5
    env:
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
      WATCHCAT_BACKEND: kqueue

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Ruby & Rust
      uses: oxidize-rb/actions/setup-ruby-and-rust@v1.5.0
      with:
        ruby-version: '3.4'
        bundler-cache: true
        cargo-cache: true
        bundler: "latest"
        rubygems: "latest"

    - name: Run test
      run: bundle exec rake

  clippy:
    runs-on: ubuntu-latest
    name: Clippy
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1.5.0
        with:
          bundler-cache: true
          cargo-cache: true
          ruby-version: '3.3'

      - name: Run Clippy
        run: cd ext/watchcat && cargo clippy --no-deps -- -D warnings

  windows:
    runs-on: ${{ matrix.os }}
    name: Test (Ruby ${{ matrix.ruby }} on ${{ matrix.os }})
    timeout-minutes: 5
    strategy:
      matrix:
        ruby:
          - '3.4'
        os:
          - windows-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Ruby & Rust
      uses: oxidize-rb/actions/setup-ruby-and-rust@v1.5.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        cargo-cache: true
        bundler: "latest"
        rubygems: "latest"

    - name: Run test
      run: bundle exec rake
